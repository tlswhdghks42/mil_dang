name: APK Build (EAS)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "src/**"
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS Build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

# [해결] 워크플로우 전체에 Node 24 강제 적용 환경변수 추가
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
          # 와일드카드로 지정하여 경로 인식 안정성 강화
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (preview)
        if: github.event_name == 'push' || github.event.inputs.profile == 'preview'
        run: npm run build:apk
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_ACCESS_TOKEN: ${{ secrets.FCM_ACCESS_TOKEN }}
          ALIGO_API_KEY: ${{ secrets.ALIGO_API_KEY }}
          ALIGO_USER_ID: ${{ secrets.ALIGO_USER_ID }}
          ALIGO_SENDER: ${{ secrets.ALIGO_SENDER }}

      - name: Build AAB (production)
        if: github.event.inputs.profile == 'production'
        run: npm run build:aab
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_ACCESS_TOKEN: ${{ secrets.FCM_ACCESS_TOKEN }}
          ALIGO_API_KEY: ${{ secrets.ALIGO_API_KEY }}
          ALIGO_USER_ID: ${{ secrets.ALIGO_USER_ID }}
          ALIGO_SENDER: ${{ secrets.ALIGO_SENDER }}
